<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>I’d Still Rather Take the Long Way Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="blobs"></div>
  <div class="bg-img" id="bgImg"></div>
  <div class="shade"></div>
</div>

<main class="stage">
  <section class="player" aria-label="Playlist">
    <div class="cover-wrap">
      <img id="cover" alt="" hidden>
      <label class="cover-ph" id="coverPh">
        <strong></strong>
        <span></span>
        <input type="file" id="file" accept="image/*" aria-label="Choose a photo to preview as the cover">
      </label>
    </div>

    <a class="code" id="code" aria-label="Spotify code for the playlist"></a>

    <div class="meta">
      <h1 id="title"></h1>
      <p id="sub"></p>
    </div>

    <div class="controls">
      <button class="ic heart stroke" id="heart" type="button" aria-pressed="false" aria-label="Like">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </button>
      <button class="ic" id="prev" type="button" aria-label="Previous line">
        <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <a class="ic play" id="play" href="#" target="_blank" rel="noopener" aria-label="Play the playlist on Spotify">
        <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </a>
      <button class="ic" id="next" type="button" aria-label="Next line">
        <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
      <button class="ic stroke" id="repeat" type="button" aria-pressed="false" aria-label="Repeat">
        <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>
      </button>
    </div>

    <div class="progress">
      <span id="t0">0:00</span>
      <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Position in the letter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="fill" id="fill"></div>
      </div>
      <span id="t1">0:00</span>
    </div>
  </section>

  <section class="letter" id="letter" aria-label="A letter about the playlist">
    <div class="lines" id="lines"></div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
